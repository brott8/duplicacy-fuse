name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: true

      - name: Install FUSE2 build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev pkg-config

      - name: Test root module
        run: go test ./...

      - name: Race-test root module
        run: go test -race ./...

      - name: Build Linux binary
        run: go build ./...

      - name: Test dpfs module
        working-directory: dpfs
        run: go test ./...

      - name: Race-test dpfs module
        working-directory: dpfs
        run: go test -race ./...
